name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    env:
      # pyproject.toml pins python-preference = "only-system" for local setups; the
      # runner has no system Python 3.10, so let uv download one here
      UV_PYTHON_PREFERENCE: managed

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uvx ruff@0.15.5 check

      - name: Test
        run: uv run pytest tests/ -v --tb=short
