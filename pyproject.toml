[project]
name = "act-reimplementation"
version = "0.1.0"
description = "Reimplementation of Action Chunking with Transformers (ACT) for robot imitation learning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "lerobot>=0.3",
    "einops>=0.7",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "av>=12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["act*", "training*", "inference*"]

[tool.uv]
python-preference = "only-system"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "platform_system == 'Linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
