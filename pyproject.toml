[project]
name = "act-reimplementation"
version = "0.1.0"
description = "Reimplementation of Action Chunking with Transformers (ACT) for robot imitation learning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "lerobot>=0.3",
    "einops>=0.7",
    "numpy>=1.24",
    "tqdm>=4.65",
    "av>=12.0",
    "wandb>=0.16",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.7",
    "pytest>=8.0",
    "pre-commit>=4.0",
    "h5py>=3.9",
]
robot = [
    "ur-rtde>=1.5",
    "opencv-python>=4.8",
    "pyrealsense2>=2.55",
    "pyserial>=3.5",
]
sim = [
    "gym-aloha>=0.1.2,<0.2.0",
]

[project.scripts]
act-train = "train:main"
act-eval  = "eval:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["act*", "training*", "evaluation*"]

[tool.setuptools]
# Entry scripts live at the repo root; installing them as modules makes the
# act-train / act-eval console scripts importable from any directory
py-modules = ["train", "eval", "inference"]

[tool.uv]
python-preference = "only-system"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "platform_system == 'Linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Same pinned rule set as the DP repo: ruff's defaults change between releases
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["act", "training", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
