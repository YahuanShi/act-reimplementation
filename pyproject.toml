[project]
name = "act-reimplementation"
version = "0.1.0"
description = "Reimplementation of Action Chunking with Transformers (ACT) for robot imitation learning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "lerobot>=0.1",
    "einops>=0.7",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["act*", "training*", "inference*"]
