[project]
name = "act-reimplementation"
version = "0.1.0"
description = "Reimplementation of Action Chunking with Transformers (ACT) for robot imitation learning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "lerobot>=0.3",
    "einops>=0.7",
    "numpy>=1.24",
    "tqdm>=4.65",
    "av>=12.0",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.7",
    "pytest>=8.0",
    "pre-commit>=4.0",
    "h5py>=3.9",
]
robot = [
    "opencv-python>=4.8",
    "pyrealsense2>=2.55",
    "pyserial>=3.5",
]

[project.scripts]
act-train = "train:main"
act-eval  = "eval:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["act*", "training*", "inference*", "evaluation*"]

[tool.uv]
python-preference = "only-system"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "platform_system == 'Linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
